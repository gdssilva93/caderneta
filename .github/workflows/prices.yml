name: Atualizar cotações

on:
  schedule:
    - cron: "17 7-20/2 * * *"   # de 2 em 2 horas, das 7h às 20h UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["prices.json"]

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_prices.py
      - name: Commit
        run: |
          git config user.name "caderneta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Cotações $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
